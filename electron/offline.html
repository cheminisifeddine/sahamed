<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SahaMed — Connexion</title>
<style>
  :root { --primary: #0F4C81; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef4f8 100%);
    color: #0F172A;
  }
  .box { text-align: center; max-width: 460px; padding: 32px; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 20px; border-radius: 50%;
    border: 4px solid #E2E8F0; border-top-color: var(--primary);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; margin: 0 0 8px; color: #1E293B; }
  p { font-size: 13.5px; color: #64748B; line-height: 1.6; margin: 0 0 18px; }
  .ip { font-family: monospace; font-weight: 700; color: var(--primary); }
  button {
    border: none; border-radius: 10px; padding: 10px 18px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; background: var(--primary); color: #fff; margin: 0 6px;
  }
  button.ghost { background: #F1F5F9; color: #334155; }
  .hint { margin-top: 20px; font-size: 11.5px; color: #94A3B8; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connexion au poste principal...</h1>
    <p id="desc">Tentative de connexion à <span class="ip" id="ip"></span>. Vérifiez qu'SahaMed est bien lancé sur le poste principal et que les deux ordinateurs sont sur le même réseau.</p>
    <div>
      <button id="retry">Réessayer maintenant</button>
      <button class="ghost" id="reconfigure">Changer de poste principal</button>
    </div>
    <div class="hint">Reconnexion automatique en cours... (raccourci Ctrl+Alt+R pour reconfigurer)</div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ip = params.get('ip') || '';
  document.getElementById('ip').textContent = ip;

  document.getElementById('retry').addEventListener('click', () => window.offlineApi.retry());
  document.getElementById('reconfigure').addEventListener('click', () => window.offlineApi.reconfigure());
</script>
</body>
</html>
