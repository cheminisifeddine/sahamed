<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posologie & ANPP — SahaMed DZ</title><link rel="stylesheet" href="/dz/dz.css"></head><body>
<header class="top"><a href="/dz/">← Modules</a><h1>💊 Posologie pédiatrique & ANPP</h1><span id="lic"></span></header>
<main>
  <div class="panel"><h2>Recherche ANPP (DCI / marque)</h2>
    <input id="q" placeholder="ex : amoxicilline, Augmentin, paracétamol…"><div id="res"></div>
  </div>
  <div class="panel"><h2>Calculateur poids → dose</h2>
    <div class="row">
      <div><label>Poids enfant (kg)</label><input id="poids" type="number" step="0.1" value="12.5"></div>
      <div><label>Code médicament</label><input id="code" value="AMOX250"></div>
      <div><label>Durée (jours)</label><input id="duree" type="number" value="7"></div>
    </div>
    <button id="b-poso">Calculer</button><div id="poso"></div>
  </div>
  <div class="panel"><h2>Interactions (DDI) — codes séparés par des virgules</h2>
    <input id="ddi" value="ENAL10,SPIR25"><button id="b-ddi">Vérifier</button><div id="ddi-res"></div>
  </div>
</main>
<script src="/dz/dz.js"></script>
<script>(async function () {
  DZ.licenseChip(document.getElementById('lic'));
  document.getElementById('q').addEventListener('input', async e => {
    const q = e.target.value.trim();
    if (q.length < 2) { document.getElementById('res').innerHTML = ''; return; }
    try {
      const rows = await DZ.rpc('dz:anpp.search', [q]);
      document.getElementById('res').innerHTML = '<table><tr><th>Marque</th><th>DCI</th><th>Dosage</th><th>Forme</th><th></th><th></th></tr>' + rows.map(m =>
        `<tr><td><b>${DZ.esc(m.marque)}</b>${m.rupture ? ' <span class="badge red">RUPTURE</span>' : ''}${m.est_psychotrope ? ' <span class="badge amber">PSY</span>' : ''}</td><td>${DZ.esc(m.dci)}</td><td>${DZ.esc(m.dosage)}</td><td>${DZ.esc(m.forme)}</td>
        <td><button class="ghost" data-eq="${m.code}">Équivalents</button></td><td><button class="ghost" data-use="${m.code}">Doser</button></td></tr>`).join('') + '</table>';
      document.querySelectorAll('[data-eq]').forEach(b => b.onclick = async () => {
        const r = await DZ.rpc('dz:equivalents', [b.dataset.eq]);
        DZ.toast(r.equivalents.length ? 'Équivalents : ' + r.equivalents.map(x => x.marque + (x.rupture ? ' (rupture)' : '')).join(', ') : 'Aucun équivalent enregistré', true);
      });
      document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { document.getElementById('code').value = b.dataset.use; window.scrollTo(0, 400); });
    } catch(e) { DZ.toast(e.message, false); }
  });
  document.getElementById('b-poso').onclick = async () => {
    try {
      const r = await DZ.rpc('dz:posologie', [{ poids_kg: +document.getElementById('poids').value, code_medicament: document.getElementById('code').value.trim(), duree_jours: +document.getElementById('duree').value }]);
      document.getElementById('poso').innerHTML = r.phrase ? `<p style="font-size:18px">📋 <b>${DZ.esc(r.phrase)}</b></p>` : `<pre>${DZ.esc(JSON.stringify(r, null, 2))}</pre>`;
    } catch(e) { DZ.toast(e.message, false); }
  };
  document.getElementById('b-ddi').onclick = async () => {
    try {
      const r = await DZ.rpc('dz:ddi.check', [{ codes: document.getElementById('ddi').value.split(',').map(s => s.trim()).filter(Boolean) }]);
      document.getElementById('ddi-res').innerHTML = r.alertes.length ? r.alertes.map(a =>
        `<div class="alert ${a.severite}">⚠️ <b>${a.severite}</b> — ${DZ.esc(a.molecules.join(' + '))}<br>${DZ.esc(a.mecanisme)}<br>👉 ${DZ.esc(a.conduite)}</div>`).join('')
        : '<p>✅ Aucune interaction connue pour cette association.</p>';
    } catch(e) { DZ.toast(e.message, false); }
  };
})();</script></body></html>
