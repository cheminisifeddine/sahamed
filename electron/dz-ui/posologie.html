<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posologie & ANPP — Clinixos</title><link rel="stylesheet" href="/dz/dz.css"></head><body>
<main class="page">
  <div class="dz-page-head">
    <div>
      <div class="page-title">Posologie & ANPP</div>
      <div class="page-subtitle">Doses pédiatriques au poids, interactions (DDI) et équivalents — nomenclature nationale</div>
    </div>
  </div>

  <div class="panel">
    <h2>Recherche ANPP <span class="badge slate" id="anpp-n">…</span></h2>
    <label for="q">DCI ou marque</label>
    <input id="q" placeholder="ex : amoxicilline, Augmentin, paracétamol…" autocomplete="off">
    <div id="res"></div>
  </div>

  <div class="panel">
    <h2>Calculateur poids → dose</h2>
    <div class="row">
      <div><label for="poids">Poids enfant (kg)</label><input id="poids" type="number" step="0.1" min="0.5" value="12.5"></div>
      <div><label for="code">Code médicament</label><input id="code" value="AMOX250" list="codes"></div>
      <div><label for="duree">Durée (jours)</label><input id="duree" type="number" min="1" value="7"></div>
    </div>
    <datalist id="codes"></datalist>
    <div class="btn-row">
      <button id="b-poso" class="btn btn-primary">📋 Calculer la posologie</button>
    </div>
    <div id="poso"></div>
  </div>

  <div class="panel">
    <h2>Interactions médicamenteuses (DDI)</h2>
    <label for="ddi">Codes séparés par des virgules</label>
    <input id="ddi" value="ENAL10,SPIR25" placeholder="AMOX250,ASP100">
    <div class="btn-row">
      <button id="b-ddi" class="btn btn-primary">🔍 Vérifier les interactions</button>
    </div>
    <div id="ddi-res"></div>
  </div>

  <footer class="dz-foot">Listes I/II/III · psychotropes décret 19-379 · sirop ≥ 25 mg/5 ml privilégié &lt; 5 ans</footer>
</main>
<script src="/dz/dz.js"></script>
<script>(async function () {
  if (window.self === window.top) DZ.mountHeader('Posologie & ANPP');

  try {
    const all = await DZ.rpc('dz:anpp.search', ['']);
    document.getElementById('anpp-n').textContent = (Array.isArray(all) ? all.length : 0) + ' molécules';
    const dl = document.getElementById('codes');
    if (Array.isArray(all)) all.slice(0, 500).forEach(m => {
      const o = document.createElement('option');
      o.value = m.code;
      o.label = m.marque + ' — ' + m.dci;
      dl.appendChild(o);
    });
  } catch (e) { /* ignore */ }

  let t = null;
  document.getElementById('q').addEventListener('input', e => {
    clearTimeout(t);
    const q = e.target.value.trim();
    if (q.length < 2) { document.getElementById('res').innerHTML = ''; return; }
    t = setTimeout(async () => {
      try {
        const rows = await DZ.rpc('dz:anpp.search', [q]);
        if (!rows.length) {
          document.getElementById('res').innerHTML = '<p class="dz-hint">Aucun résultat pour « ' + DZ.esc(q) + ' ».</p>';
          return;
        }
        document.getElementById('res').innerHTML =
          '<table class="table-head"><thead><tr><th>Marque</th><th>DCI</th><th>Dosage</th><th>Forme</th><th class="noprint"></th></tr></thead><tbody>' +
          rows.map(m =>
            `<tr><td><b>${DZ.esc(m.marque)}</b>${m.rupture ? ' <span class="badge red">RUPTURE</span>' : ''}${m.est_psychotrope ? ' <span class="badge amber">PSY</span>' : ''}${m.liste_ordonnance && m.liste_ordonnance !== 'normale' ? ' <span class="badge teal">' + DZ.esc(String(m.liste_ordonnance).toUpperCase()) + '</span>' : ''}</td>` +
            `<td>${DZ.esc(m.dci)}</td><td>${DZ.esc(m.dosage)}</td><td>${DZ.esc(m.forme)}</td>` +
            `<td class="noprint"><button class="btn" data-eq="${m.code}">Équivalents</button> <button class="btn btn-primary" data-use="${m.code}">Doser</button></td></tr>`
          ).join('') + '</tbody></table>';

        document.querySelectorAll('[data-eq]').forEach(b => b.onclick = async () => {
          try {
            const r = await DZ.rpc('dz:equivalents', [b.dataset.eq]);
            DZ.toast(r.equivalents.length
              ? 'Équivalents : ' + r.equivalents.map(x => x.marque + (x.rupture ? ' (rupture)' : '')).join(', ')
              : 'Aucun équivalent enregistré', true);
          } catch (err) { DZ.toast(err.message, false); }
        });
        document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
          document.getElementById('code').value = b.dataset.use;
          document.getElementById('poids').focus();
        });
      } catch (e) { DZ.toast(e.message, false); }
    }, 250);
  });

  document.getElementById('b-poso').onclick = async () => {
    try {
      const r = await DZ.rpc('dz:posologie', [{
        poids_kg: +document.getElementById('poids').value,
        code_medicament: document.getElementById('code').value.trim(),
        duree_jours: +document.getElementById('duree').value
      }]);
      document.getElementById('poso').innerHTML = r.phrase
        ? `<div class="alert OK" style="font-size:15px">📋 <b>${DZ.esc(r.phrase)}</b></div>`
        : `<div class="alert MODEREE">Aucune règle pédiatrique pour ce code — vérifiez la posologie adulte.</div>`;
    } catch (e) { DZ.toast(e.message, false); }
  };

  document.getElementById('b-ddi').onclick = async () => {
    try {
      const codes = document.getElementById('ddi').value.split(',').map(s => s.trim()).filter(Boolean);
      const r = await DZ.rpc('dz:ddi.check', [{ codes }]);
      document.getElementById('ddi-res').innerHTML = r.alertes.length
        ? r.alertes.map(a =>
          `<div class="alert ${a.severite}">⚠️ <b>${a.severite}</b> — ${DZ.esc(a.molecules.join(' + '))}<br>${DZ.esc(a.mecanisme)}<br>👉 ${DZ.esc(a.conduite)}</div>`
        ).join('')
        : '<div class="alert OK">✅ Aucune interaction connue pour cette association.</div>';
    } catch (e) { DZ.toast(e.message, false); }
  };
})();</script>
</body></html>
