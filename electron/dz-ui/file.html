<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>File d'attente — Clinixos</title><link rel="stylesheet" href="/dz/dz.css"></head><body>
<main class="page">
  <div class="dz-page-head">
    <div>
      <div class="page-title">File d'attente</div>
      <div class="page-subtitle">Tickets, appel en salle et écran d'attente — <span dir="rtl">الدور</span></div>
    </div>
    <div class="btn-row noprint">
      <a class="btn btn-ghost" href="/tv" target="_blank" rel="noopener">📺 Écran TV</a>
    </div>
  </div>

  <div class="panel noprint">
    <h2>Nouveau ticket</h2>
    <div class="row">
      <div><label for="nom">Nom affiché</label><input id="nom" placeholder="ex : BENALI Ahmed" autocomplete="off"></div>
      <div><label for="prio">Priorité</label>
        <select id="prio">
          <option>NORMALE</option><option>URGENCE</option><option>CONTROLE</option><option>PRIORITAIRE</option>
        </select>
      </div>
      <div><label for="salle">Salle</label><input id="salle" value="Cabinet 1"></div>
    </div>
    <div class="btn-row">
      <button id="b-add" class="btn btn-primary">🎫 Ajouter le ticket</button>
    </div>
  </div>

  <div class="panel">
    <h2>En ce moment <span class="badge slate" id="count">…</span></h2>
    <div id="list"><p class="dz-hint">Chargement…</p></div>
    <div class="btn-row noprint">
      <button id="b-reset" class="btn btn-danger">🧹 Clôturer la journée (médecin)</button>
    </div>
  </div>

  <footer class="dz-foot">Appel salle + chime FR/AR diffusés sur l'écran TV · temps réel</footer>
</main>
<script src="/socket.io/socket.io.js"></script><script src="/dz/dz.js"></script>
<script>(async function () {
  if (window.self === window.top) DZ.mountHeader("File d'attente", { ar: 'الدور' });

  async function refresh() {
    try {
      const rows = await DZ.rpc('dz:file.list', []);
      document.getElementById('count').textContent = rows.length + ' en jour';
      if (!rows.length) {
        document.getElementById('list').innerHTML = '<p class="dz-hint">Aucun ticket — ajoutez un patient ci-dessus.</p>';
        return;
      }
      document.getElementById('list').innerHTML =
        '<table class="table-head"><thead><tr><th>N°</th><th>Patient</th><th>Priorité</th><th>Statut</th><th>Salle</th><th class="noprint"></th></tr></thead><tbody>' +
        rows.map(r => {
          const badge = r.priorite === 'NORMALE' ? '' :
            r.priorite === 'URGENCE' ? ' red' : r.priorite === 'CONTROLE' ? ' amber' : ' teal';
          const st = r.statut === 'ATTENTE' ? '<span class="badge slate">Attente</span>' :
            r.statut === 'EN_CONSULTATION' ? '<span class="badge green">En cours</span>' :
            r.statut === 'TERMINE' ? '<span class="badge slate">Terminé</span>' :
            '<span class="badge red">Absent</span>';
          return `<tr><td><b>#${r.ticket_numero}</b></td><td>${DZ.esc(r.nom_affiche)}</td>` +
            `<td><span class="badge${badge}">${r.priorite}</span></td><td>${st}</td><td>${DZ.esc(r.salle || '')}</td>` +
            `<td class="noprint">${r.statut === 'ATTENTE' ? `<button class="btn btn-primary" data-call="${r.ticket_numero}">📢 Appeler</button> ` : ''}` +
            `${r.statut !== 'TERMINE' && r.statut !== 'ABSENT' ? `<button class="btn" data-done="${r.ticket_numero}">✔</button> <button class="btn btn-ghost" data-abs="${r.ticket_numero}">✖</button>` : ''}</td></tr>`;
        }).join('') + '</tbody></table>';

      document.querySelectorAll('[data-call]').forEach(b => b.onclick = () => act(+b.dataset.call, 'EN_CONSULTATION'));
      document.querySelectorAll('[data-done]').forEach(b => b.onclick = () => act(+b.dataset.done, 'TERMINE'));
      document.querySelectorAll('[data-abs]').forEach(b => b.onclick = () => act(+b.dataset.abs, 'ABSENT'));
    } catch (e) {
      document.getElementById('list').innerHTML = '<div class="alert CRITIQUE">' + DZ.esc(e.message) + '</div>';
    }
  }
  async function act(ticket, statut) {
    try { await DZ.rpc('dz:ticket.statut', [{ ticket, statut }]); }
    catch (e) { DZ.toast(e.message, false); }
  }
  document.getElementById('b-add').onclick = async () => {
    const nom = document.getElementById('nom').value.trim();
    if (!nom) { DZ.toast('Entrez un nom', false); return; }
    try {
      const t = await DZ.rpc('dz:ticket.create', [{
        nom_affiche: nom,
        priorite: document.getElementById('prio').value,
        salle: document.getElementById('salle').value
      }]);
      DZ.toast('Ticket N° ' + t.ticket_numero);
      document.getElementById('nom').value = '';
      document.getElementById('nom').focus();
    } catch (e) { DZ.toast(e.message, false); }
  };
  document.getElementById('b-reset').onclick = async () => {
    if (!confirm('Clôturer tous les tickets du jour ?')) return;
    try { await DZ.rpc('dz:file.reset', []); DZ.toast('Journée clôturée'); }
    catch (e) { DZ.toast(e.message, false); }
  };
  try {
    const s = io({ transports: ['websocket', 'polling'] });
    s.on('file:changed', refresh);
    s.on('file:appel', refresh);
  } catch (e) { /* polling manuel */ }
  refresh();
  setInterval(refresh, 15000);
})();</script>
</body></html>
